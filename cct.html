<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全语言零压缩安全注释清洗工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbcbcb; border-radius: 4px; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col font-sans">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 px-6 py-4 shadow-sm flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <span class="text-2xl">🛡️</span>
            <div>
                <h1 class="text-lg font-bold text-gray-900">全语言代码安全清洗工具 (零压缩·全格式)</h1>
                <p class="text-xs text-gray-500">严格保留所有换行与缩进排版，支持 HTML/Vue/JS/TS/CSS/Python/C++/Java/SQL/YAML 等广泛格式</p>
            </div>
        </div>
        <div class="text-xs text-green-700 bg-green-100 px-2.5 py-1 rounded-full font-medium">全语言通用版 V4.0</div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Left: Input & Drop Zone -->
        <div id="dropZone" class="flex flex-col bg-white rounded-xl border-2 border-dashed border-gray-300 shadow-sm overflow-hidden transition-all duration-200">
            <div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <div class="flex items-center space-x-2">
                    <span class="text-sm font-semibold text-gray-700">📄 原始代码 / 拖入文件</span>
                    <span id="fileNameBadge" class="hidden text-[10px] bg-red-100 text-red-800 px-2 py-0.5 rounded font-mono"></span>
                </div>
                <div class="space-x-2">
                    <input type="file" id="fileInput" class="hidden" accept=".html,.htm,.vue,.js,.ts,.jsx,.tsx,.css,.less,.scss,.sass,.java,.c,.cpp,.cs,.go,.php,.swift,.kt,.dart,.py,.sh,.yaml,.yml,.toml,.r,.sql,.xml,.svg,.txt">
                    <button onclick="document.getElementById('fileInput').click()" class="text-xs text-blue-600 hover:underline">📂 选择本地文件</button>
                    <button onclick="clearInput()" class="text-xs text-red-600 hover:underline">清空</button>
                </div>
            </div>
            
            <div class="relative flex-1 flex flex-col">
                <textarea id="rawInput" placeholder="直接在此粘贴代码，或者把文件拖放到这里..." class="flex-1 w-full p-4 font-mono text-xs focus:outline-none resize-none border-none leading-relaxed"></textarea>

                <!-- Overlay prompt when dragging -->
                <div id="dragOverlay" class="absolute inset-0 bg-blue-50/90 border-2 border-dashed border-blue-500 rounded-b-xl flex flex-col items-center justify-center space-y-2 pointer-events-none opacity-0 transition-opacity duration-200">
                    <span class="text-3xl">📥</span>
                    <span class="text-sm font-bold text-blue-700">松开鼠标即可导入文件</span>
                </div>
            </div>
        </div>

        <!-- Right: Output -->
        <div class="flex flex-col bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
            <div class="px-4 py-3 bg-gray-50 border-b border-gray-200 flex justify-between items-center">
                <span class="text-sm font-semibold text-gray-700">✨ 清洗后的代码 (格式与排版原样保留)</span>
                <div class="space-x-2">
                    <button onclick="copyOutput()" class="px-3 py-1 bg-gray-200 hover:bg-gray-300 rounded text-xs transition">复制代码</button>
                    <button onclick="downloadOutput()" class="px-3 py-1 bg-blue-700 hover:bg-blue-800 text-white rounded text-xs transition font-medium">📥 下载清洗后的文件</button>
                </div>
            </div>
            <textarea id="cleanOutput" readonly placeholder="清洗后的纯净代码将显示在这里..." class="flex-1 w-full p-4 font-mono text-xs focus:outline-none resize-none border-none bg-gray-50 leading-relaxed"></textarea>
        </div>
    </main>

    <!-- Control Bar -->
    <div class="bg-white border-t border-gray-200 px-6 py-4 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center space-x-6 text-xs text-gray-600 flex-wrap gap-y-2">
            <label class="flex items-center space-x-2 cursor-pointer" title="如需后续自己手工注入水印，请勿勾选此项">
                <input type="checkbox" id="optWatermark" class="rounded text-blue-600 focus:ring-blue-500">
                <span>清除零宽隐形水印字符 (\u200B/\u200C/\uFEFF)</span>
            </label>
            <label class="flex items-center space-x-2 cursor-pointer">
                <input type="checkbox" id="optComments" checked class="rounded text-blue-600 focus:ring-blue-500">
                <span>安全擦除代码注释 (自动匹配文件类型，严格保留换行)</span>
            </label>
        </div>
        <button onclick="processClean()" class="px-6 py-2 bg-blue-700 hover:bg-blue-800 text-white font-semibold rounded-lg shadow transition text-sm">
            🚀 开始安全清洗
        </button>
    </div>

    <!-- Processing Logic -->
    <script>
        let loadedFileName = 'cleaned_code.txt';
        let fileExt = 'txt';

        const dropZone = document.getElementById('dropZone');
        const dragOverlay = document.getElementById('dragOverlay');
        const rawInput = document.getElementById('rawInput');
        const fileInput = document.getElementById('fileInput');

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dragOverlay.classList.remove('opacity-0');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault(); e.stopPropagation();
                dragOverlay.classList.add('opacity-0');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const files = e.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            const nameParts = file.name.split('.');
            fileExt = nameParts.length > 1 ? nameParts.pop().toLowerCase() : 'txt';
            const baseName = nameParts.join('.');
            
            loadedFileName = `${baseName}.clean.${fileExt}`;
            document.getElementById('fileNameBadge').innerText = file.name;
            document.getElementById('fileNameBadge').classList.remove('hidden');

            const reader = new FileReader();
            reader.onload = function(e) {
                rawInput.value = e.target.result;
                processClean();
            };
            reader.readAsText(file, 'UTF-8');
        }

        // 1. C 风格注释擦除 (适用于 JS, TS, JSX, TSX, CSS, Java, C++, Go, PHP 等)
        function cleanCStyle(code) {
            const tokenRegex = /("([^"\\]|\\.)*"|'([^'\\]|\\.)*'|`([^`\\]|\\.)*`|\/([^\/\*\\]|\\.)+\/[gimusuyd]*)|(\/\*[\s\S]*?\*\/|\/\/[^\r\n]*)/g;
            return code.replace(tokenRegex, function(match, literal, g2, g3, g4, g5, comment) {
                if (literal) return literal;
                if (comment && comment.startsWith('//')) return '';
                if (comment && comment.startsWith('/*')) {
                    const newlineCount = (comment.match(/\n/g) || []).length;
                    return '\n'.repeat(newlineCount);
                }
                return '';
            });
        }

        // 2. 井号 (#) 注释擦除 (适用于 Python, Shell, YAML, TOML, R)
        function cleanHashStyle(code) {
            const tokenRegex = /("([^"\\]|\\.)*"|'([^'\\]|\\.)*'|`([^`\\]|\\.)*`)|(#[^\r\n]*)/g;
            return code.replace(tokenRegex, function(match, literal, g2, g3, g4, comment) {
                if (literal) return literal;
                if (comment) return '';
                return '';
            });
        }

        // 3. SQL 注释擦除 (-- 与 /* */)
        function cleanSqlStyle(code) {
            const tokenRegex = /("([^"\\]|\\.)*"|'([^'\\]|\\.)*')|(\/\*[\s\S]*?\*\/|--[^\r\n]*)/g;
            return code.replace(tokenRegex, function(match, literal, g2, g3, comment) {
                if (literal) return literal;
                if (comment && comment.startsWith('--')) return '';
                if (comment && comment.startsWith('/*')) {
                    const newlineCount = (comment.match(/\n/g) || []).length;
                    return '\n'.repeat(newlineCount);
                }
                return '';
            });
        }

        // 4. HTML / XML 注释擦除 (<!-- -->)
        function cleanHtmlStyle(code) {
            return code.replace(/<!--(?!\[if)[\s\S]*?-->/g, function(match) {
                const newlineCount = (match.match(/\n/g) || []).length;
                return '\n'.repeat(newlineCount);
            });
        }

        // 5. 混合网页组件清洗 (HTML, Vue)
        function cleanMarkupComponent(code) {
            // 擦除 HTML 注释
            let cleaned = cleanHtmlStyle(code);

            // 擦除 <style> 中的 CSS 注释
            cleaned = cleaned.replace(/(<style[\s\S]*?>)([\s\S]*?)(<\/style>)/gi, function(match, openTag, content, closeTag) {
                return openTag + cleanCStyle(content) + closeTag;
            });

            // 擦除 <script> 中的 JS/TS 注释
            cleaned = cleaned.replace(/(<script[\s\S]*?>)([\s\S]*?)(<\/script>)/gi, function(match, openTag, content, closeTag) {
                if (openTag.includes('type=') && !/javascript|module|text\/babel|ts|typescript/i.test(openTag)) {
                    return match;
                }
                return openTag + cleanCStyle(content) + closeTag;
            });

            return cleaned;
        }

        function processClean() {
            let code = rawInput.value;
            if (!code) {
                alert('请先拖入文件或粘贴代码！');
                return;
            }

            // 1. 清除零宽隐形水印 (默认未勾选，保护 Unicode 水印；勾选后仅删 \u200B\u200C\uFEFF，严格保留 \u200D Emoji)
            if (document.getElementById('optWatermark').checked) {
                code = code.replace(/[\u200B\u200C\uFEFF]/g, '');
            }

            // 2. 根据扩展名智能分配清洗策略
            if (document.getElementById('optComments').checked) {
                switch (fileExt) {
                    case 'html': case 'htm': case 'vue':
                        code = cleanMarkupComponent(code);
                        break;
                    case 'xml': case 'svg':
                        code = cleanHtmlStyle(code);
                        break;
                    case 'py': case 'sh': case 'yaml': case 'yml': case 'toml': case 'r':
                        code = cleanHashStyle(code);
                        break;
                    case 'sql':
                        code = cleanSqlStyle(code);
                        break;
                    default:
                        // 包含 js, ts, jsx, tsx, css, less, scss, sass, java, c, cpp, cs, go, php, swift, kt, dart 等
                        code = cleanCStyle(code);
                        break;
                }
            }

            document.getElementById('cleanOutput').value = code;
        }

        function clearInput() {
            rawInput.value = '';
            document.getElementById('cleanOutput').value = '';
            document.getElementById('fileNameBadge').classList.add('hidden');
            fileInput.value = '';
            fileExt = 'txt';
        }

        function copyOutput() {
            const output = document.getElementById('cleanOutput');
            if (!output.value) return;
            output.select();
            document.execCommand('copy');
            alert('已复制清洗后的代码到剪贴板！');
        }

        function downloadOutput() {
            const val = document.getElementById('cleanOutput').value;
            if (!val) {
                alert('暂无内容可供下载');
                return;
            }
            const blob = new Blob([val], { type: 'text/plain;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = loadedFileName || 'cleaned_code.txt';
            link.click();
        }
    </script>
</body>
</html>
