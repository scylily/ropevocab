<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBTI 潜向行为性格指标测试</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      :root {
        --bg-color: #ffffff;
        /* 明亮白底色 */
        --card-bg: #ffffff;
        --accent-color: #d4af37;
        /* 金色保留作为点缀 */
        --text-main: #333333;
        /* 深色文字用于阅读 */
        --text-dim: #7f8c8d;
        /* 次要灰色文字 */
        --border-color: #e0e0e0;
        /* 浅灰色边框 */
      }

      body {
        font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 800px;
        width: 100%;
        background: var(--card-bg);
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
        /* 更柔和的阴影 */
        border: 1px solid var(--border-color);
      }

      header {
        text-align: center;
        margin-bottom: 50px;
        position: relative;
      }

      header::after {
        content: '';
        display: block;
        width: 60px;
        height: 2px;
        background: var(--accent-color);
        margin: 15px auto 0;
      }

      h1 {
        font-size: 3em;
        letter-spacing: 8px;
        color: var(--text-main);
        margin: 0;
      }

      .sub-title {
        font-size: 0.9em;
        color: var(--text-dim);
        letter-spacing: 2px;
        margin-top: 10px;
        text-transform: uppercase;
      }

      .intro {
        background: #fdfaf2;
        /* 极淡的金色背景垫底 */
        padding: 20px;
        border: 1px solid rgba(212, 175, 55, 0.15);
        margin-bottom: 40px;
        font-size: 0.95em;
        line-height: 1.8;
        color: #666;
        border-radius: 4px;
      }

      .q-item {
        margin-bottom: 45px;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 30px;
      }

      .q-text {
        font-size: 1.1em;
        font-weight: 600;
        margin-bottom: 20px;
        display: block;
        letter-spacing: 1px;
        color: var(--text-main);
      }

      .options {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .options label {
        padding: 16px 20px;
        background: #fff;
        border: 1px solid var(--border-color);
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        border-radius: 4px;
        color: #555;
      }

      .options label:hover {
        background: #fdfaf2;
        border-color: var(--accent-color);
        color: var(--text-main);
      }

      .options input[type="radio"] {
        margin-right: 15px;
        accent-color: var(--accent-color);
      }

      .submit-btn {
        width: 100%;
        padding: 20px;
        background: var(--accent-color);
        color: #fff;
        /* 按钮文字用白色 contrast */
        border: none;
        font-size: 1.1em;
        font-weight: bold;
        letter-spacing: 4px;
        cursor: pointer;
        margin-top: 20px;
        transition: all 0.3s;
        border-radius: 4px;
      }

      .submit-btn:hover {
        background: #b6932f;
        box-shadow: 0 5px 15px rgba(182, 147, 47, 0.3);
      }

      /* 结果展示区 */
      #result-area {
        display: none;
        text-align: center;
        animation: fadeIn 0.8s;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .res-header {
        color: var(--text-dim);
        font-size: 0.85em;
        letter-spacing: 3px;
        font-weight: bold;
      }

      .res-code {
        font-size: 4.5em;
        font-weight: 800;
        color: var(--accent-color);
        margin: 10px 0;
        letter-spacing: 10px;
      }

      .res-tag {
        font-size: 2em;
        font-weight: bold;
        margin-bottom: 40px;
        color: var(--text-main);
      }

      .chart-container {
        width: 100%;
        max-width: 450px;
        margin: 0 auto 40px;
      }

      .egg-box {
        text-align: left;
        background: #fff;
        padding: 30px;
        border: 1px solid var(--border-color);
        margin-top: 30px;
        line-height: 2;
        border-radius: 4px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.02);
      }

      .egg-title {
        color: var(--accent-color);
        font-weight: bold;
        margin-bottom: 15px;
        font-size: 1.1em;
        display: block;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 8px;
      }

      footer {
        margin-top: 60px;
        color: #bbb;
        font-size: 0.8em;
        text-align: center;
        border-top: 1px solid #f0f0f0;
        padding-top: 20px;
      }
    </style>
  </head>

  <body>

    <div class="container">
      <div id="quiz-ui">
        <header>
          <h1>IBTI</h1>
          <div class="sub-title">INCLINATION BEHAVIOR TYPE INDICATOR</div>
        </header>

        <div class="intro">
          <strong>核心哲学：</strong> 行为是心理底层的外放。本指标通过四个维度界定你的互动人格。
          请排除外界干扰，选择最符合你潜意识直觉的选项。
        </div>

        <form id="quiz-form">
          <div id="questions-wrapper"></div>
          <button type="button" class="submit-btn" onclick="calculateIBTI()">提交并解析人格映射</button>
        </form>
      </div>

      <div id="result-area">
        <div class="res-header">测评结果生成的性格映射代号</div>
        <div class="res-code" id="res-code"></div>
        <div class="res-tag" id="res-tag"></div>

        <div class="chart-container">
          <canvas id="radarChart"></canvas>
        </div>

        <div class="egg-box">
          <span class="egg-title">现实心理映射分析：</span>
          <div id="res-egg" style="color: #666;"></div>
        </div>

        <button class="submit-btn" onclick="location.reload()" style="background:#f5f5f5; color:#555; border:1px solid #e0e0e0; margin-top:40px;">重新测评</button>
      </div>
    </div>

    <script>
      // 矩阵标签完全保留
      const IBTI_MATRIX = {
        'M-I-C-G': '首席统筹官', 'M-I-C-D': '深度架构师', 'M-I-O-G': '实感指导者', 'M-I-O-D': '高压塑形师',
        'S-R-C-G': '情绪共鸣者', 'S-R-C-D': '精神追随者', 'S-R-O-G': '感官接收方', 'S-R-O-D': '深度感知者',
        'X-I-O-D': '全能探险家', 'X-R-C-G': '氛围协调员', 'X-I-C-D': '策略博弈者', 'X-R-O-G': '直觉感知位',
        'M-R-C-D': '静默观察家', 'S-I-O-G': '主动协作员', 'M-X-O-G': '实感调律手', 'S-X-C-D': '深度回响者'
      };

      const questions = [
        // 维度 MS
        { d: 'MS', q: "你和伴侣去陌生城市旅行，你更希望：", a: "由你制定全程路线并预定餐厅，确保一切按计划进行。", b: "对方带路并打理好所有琐事，你只需跟随和享受惊喜。", va: 'M', vb: 'S' },
        { d: 'MS', q: "当你结束了极其压力的工作周，你最想获得哪种安慰？", a: "对方安静听你抱怨，并由你决定如何安排接下来的休息。", b: "对方全盘接管你的生活，甚至替你决定今晚穿什么、吃什么。", va: 'M', vb: 'S' },
        { d: 'MS', q: "家里被对方收拾得井井有条，但完全打乱了你原本的摆放习惯，你会：", a: "感到不悦，会要求以后必须按照你的标准来摆放。", b: "感到轻松，很享受这种被照顾、被安排的感觉。", va: 'M', vb: 'S' },
        { d: 'MS', q: "如果对方在互动中不小心犯了错，你内心的第一冲动是：", a: "明确指出错误，并要求对方为此做出补偿或改进。", b: "等待对方的指引或安抚，希望对方能处理好当下的尴尬。", va: 'M', vb: 'S' },
        { d: 'MS', q: "你认为最极致的浪漫是：", a: "能够为对方修筑起一道坚实的围墙，并主导其中的规则。", b: "拥有一个可以让你放下所有面具、彻底交出责任的避风港。", va: 'M', vb: 'S' },
        { d: 'MS', q: "在餐厅点餐时，你更喜欢：", a: "你询问对方的忌口，然后由你下达指令。", b: "对方直接合上菜单对服务生说“照我的安排上菜”。", va: 'M', vb: 'S' },
        { d: 'MS', q: "如果对方要求你每天准时汇报行踪，你的真实反馈是：", a: "感到被束缚，这是对你主权的侵犯。", b: "感到被牵挂，这种被监督的感觉让你心安。", va: 'M', vb: 'S' },
        { d: 'MS', q: "冷战后，你更希望：", a: "对方主动低头，并按照你设定的方式向你道歉。", b: "对方态度强势地打断冷战，并引导你恢复正常沟通。", va: 'M', vb: 'S' },
        { d: 'MS', q: "你什么时候感到最自由？", a: "当我拥有绝对的权力支配我的生活和环境时。", b: "当我被全然的信任包裹，不再需要做任何决策时。", va: 'M', vb: 'S' },
        { d: 'MS', q: "如果要选择一个在关系中的身份关键词：", a: "领航员：我负责观察航向，确保船只安全。", b: "乘客：我负责领略美景，信任对方的驾驶。", va: 'M', vb: 'S' },
        // 维度 IR
        { d: 'IR', q: "在一个安静的独处夜晚，你通常会：", a: "主动制造话题或发起一些肢体上的小动作。", b: "保持静默，等待对方察觉并给出互动的信号。", va: 'I', vb: 'R' },
        { d: 'IR', q: "最让你感到快乐的时刻是：", a: "当我的某个行为让对方产生了剧烈的反应或情绪波动。", b: "当我完全沉浸并感知到对方带给我的力量与压迫。", va: 'I', vb: 'R' },
        { d: 'IR', q: "你更偏向于哪种能量状态？", a: "我像是一把火，负责点燃对方的热情。", b: "我像一面镜子，负责精准反射对方的动作。", va: 'I', vb: 'R' },
        { d: 'IR', q: "在互动的关键时刻，你更关注：", a: "我现在应该做点什么来推进当下的气氛。", b: "对方现在正在对我做什么，以及我的感受。", va: 'I', vb: 'R' },
        { d: 'IR', q: "你认为最好的配合是：", a: "能够预判对方的需求，并主动做出让对方满意的动作。", b: "能够敏锐接收对方的信号，并给出最真实的反馈。", va: 'I', vb: 'R' },
        { d: 'IR', q: "在互动中你的视线倾向于：", a: "盯着对方，观察对方因为你而产生的细微变化。", b: "闭上眼或避开视线，全神贯注感受身体的共振。", va: 'I', vb: 'R' },
        { d: 'IR', q: "当节奏慢下来时，你会：", a: "感到不安，会想办法增加一点新的刺激或动作。", b: "感到平静，顺从并看对方接下来想做什么。", va: 'I', vb: 'R' },
        { d: 'IR', q: "你认为自己最迷人的能力是：", a: "拥有很强的行动力和创造力，能带给对方惊喜。", b: "拥有很强的适应力和共情力，能让对方感到尽兴。", va: 'I', vb: 'R' },
        { d: 'IR', q: "关于“塑造”的倾向，你倾向于：", a: "把对方当作艺术品，用我的方式去“雕琢”。", b: "把自己当作对方的“画布”，任由对方去“描绘”。", va: 'I', vb: 'R' },
        { d: 'IR', q: "感觉能量充沛是因为：", a: "我正在输出力量，看着对方在我的节奏中改变。", b: "我正在吸收能量，感受对方带给我的撞击与包围。", va: 'I', vb: 'R' },
        // 维度 CO
        { d: 'CO', q: "最能瞬间点燃你的是：", a: "对方在耳边的低声耳语，那种带有权力的言语暗示。", b: "对方手心的温度突然贴上你的皮肤，那种直接触感。", va: 'C', vb: 'O' },
        { d: 'CO', q: "第二天醒来，你印象最深的是：", a: "昨晚那种博弈、对抗、心理拉扯的气氛。", b: "昨晚身体产生的疼痛、酸胀或极致的生理快感。", va: 'C', vb: 'O' },
        { d: 'CO', q: "你更喜欢的指令风格：", a: "隐晦、幽默但带有威胁感的心理挑战。", b: "直接、明确且带有身体限制的物理要求。", va: 'C', vb: 'O' },
        { d: 'CO', q: "如果被要求做略显尴尬的事，让你兴奋的点在于：", a: "精神上的“破防”带来的心理刺激。", b: "这种行为本身带给身体的生理负荷。", va: 'C', vb: 'O' },
        { d: 'CO', q: "你通过什么确认彼此的关系：", a: "彼此心照不宣的暗号、角色扮演或身份契约。", b: "彼此身体留下的印记、红痕或肌肉的疲惫感。", va: 'C', vb: 'O' },
        { d: 'CO', q: "如果要选一种互动媒介，你会选：", a: "一个带有特殊纪念意义的、象征身份的物件。", b: "一个带有质感的、能产生感官刺激的专业工具。", va: 'C', vb: 'O' },
        { d: 'CO', q: "当你犯错时，你更在意：", a: "对方失望的眼神或言语上的责备。", b: "对方带给你的真实痛感或体能消耗。", va: 'C', vb: 'O' },
        { d: 'CO', q: "关于情境偏好，你更喜欢：", a: "像间谍博弈一样充满张力的对话和博弈。", b: "像原始狩猎一样充满力量的对抗和触碰。", va: 'C', vb: 'O' },
        { d: 'CO', q: "你认为最极致的感受是：", a: "大脑过载：心理防线被一点点磨灭。", b: "生理过载：感官阈值被一次次突破。", va: 'C', vb: 'O' },
        { d: 'CO', q: "你认为互动的灵魂环节是：", a: "长时间的聊天、试探和心理铺垫。", b: "适当的力度预热和感官上的直接激发。", va: 'C', vb: 'O' },
        // 维度 GD
        { d: 'GD', q: "对于互动中的“失控”，你的看法是：", a: "绝对禁止，一切必须在可控且安全的范围内。", b: "偶尔向往，失控带来的濒临感非常迷人。", va: 'G', vb: 'D' },
        { d: 'GD', q: "关于“安全词”的使用倾向：", a: "几乎不需要用到它，互动始终是温和且循序渐进的。", b: "它是最后的防线，让我们能放手去探索极致边界。", va: 'G', vb: 'D' },
        { d: 'GD', q: "关于频率与深度的平衡：", a: "这种爱好应该融入生活，温柔、长久且自然。", b: "这种爱好应该是“离线状态”，追求重度刺激。", va: 'G', vb: 'D' },
        { d: 'GD', q: "你如何看待“疼痛”：", a: "它是需要极力避免的负面体验。", b: "它是通往灵魂深处、产生极速快感的阶梯。", va: 'G', vb: 'D' },
        { d: 'GD', q: "面对从未涉足的重度尝试，你会：", a: "本能地拒绝或感到恐惧，需要极长的时间准备。", b: "感到紧张但也有一丝兴奋，愿意在信任下尝试。", va: 'G', vb: 'D' },
        { d: 'GD', q: "你追求的互动结果：", a: "一场愉悦的放松，结束后感到温馨和亲密。", b: "一场灵魂的洗礼，结束后感到重获新生。", va: 'G', vb: 'D' },
        { d: 'GD', q: "你对“胃口”的自我认知：", a: "经常性的、轻度的“餐后甜点”。", b: "偶尔的、但规模宏大的“饕餮盛宴”。", va: 'G', vb: 'D' },
        { d: 'GD', q: "面对所谓的禁忌，你的反应是：", a: "感到不适，不想在互动中涉及任何严肃压力点。", b: "感到好奇，认为那是挖掘人性真实面的宝藏。", va: 'G', vb: 'D' },
        { d: 'GD', q: "落幕时你最想听的一句话：", a: "“刚刚一切都很舒服吧？”", b: "“我们刚才真的走得很远。”", va: 'G', vb: 'D' },
        { d: 'GD', q: "你希望通过 IBTI 变成什么样：", a: "舒缓生活压力，做一个内心更平顺、更温柔的人。", b: "看到自己潜意识里的疯狂，做一个更有深度的人。", va: 'G', vb: 'D' }
      ];

      const shuffled = [...questions].sort(() => Math.random() - 0.5);

      function init() {
        const wrapper = document.getElementById('questions-wrapper');
        shuffled.forEach((q, i) => {
          const div = document.createElement('div');
          div.className = 'q-item';
          div.innerHTML = `
                <span class="q-text">${i + 1}. ${q.q}</span>
                <div class="options">
                    <label><input type="radio" name="q${i}" value="${q.va}" required> A. ${q.a}</label>
                    <label><input type="radio" name="q${i}" value="${q.vb}"> B. ${q.b}</label>
                </div>
            `;
          wrapper.appendChild(div);
        });
      }

      function calculateIBTI() {
        const form = document.getElementById('quiz-form');
        const fd = new FormData(form);
        const ans = Array.from(fd.values());

        if (ans.length < 40) {
          alert("请完成所有题目再提交分析。");
          return;
        }

        const scores = { M: 0, S: 0, I: 0, R: 0, C: 0, O: 0, G: 0, D: 0 };
        shuffled.forEach((q, i) => { scores[ans[i]]++; });

        const getDim = (a, b) => {
          const diff = Math.abs(scores[a] - scores[b]);
          if (diff <= 1) return 'X';
          return scores[a] > scores[b] ? a : b;
        };

        const code = `${getDim('M', 'S')}-${getDim('I', 'R')}-${getDim('C', 'O')}-${getDim('G', 'D')}`;
        renderResult(code, scores);
      }

      function renderResult(code, scores) {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('res-code').innerText = code;

        document.getElementById('res-tag').innerText = IBTI_MATRIX[code] || "复合探索者";

        let eggs = [];
        if (scores.M >= 7) eggs.push("• <strong>掌控感偏高：</strong> 你在生活里可能很怕“失控”，习惯为他人遮风挡雨，通过建立秩序获得安全感。");
        if (scores.S >= 7) eggs.push("• <strong>配合度偏高：</strong> 现实中你可能承担了过多决策责任，渴望在特定时刻彻底卸下包袱，享受被引导。");
        if (scores.C >= 7) eggs.push("• <strong>博弈偏高：</strong> 你是典型的脑力驱动型，心理拉扯对你而言是一种高级的精神减压方式。");
        if (scores.D >= 7) eggs.push("• <strong>探索深度偏高：</strong> 你对生命力的内核有极强的渴求，普通的体验难以触及你深层的灵魂。");
        if (eggs.length === 0) eggs.push("• 你是一个极为平衡的互动者，能根据环境灵活切换自己的心理映射。");

        document.getElementById('res-egg').innerHTML = eggs.join("<br><br>");

        drawChart(scores);
      }

      function drawChart(s) {
        const ctx = document.getElementById('radarChart').getContext('2d');
        new Chart(ctx, {
