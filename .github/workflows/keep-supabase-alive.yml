name: Keep Multiple Supabase Projects Alive

on:
  schedule:
    # 每周一、周四的中午 12:00 (UTC) 自动定时执行
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # 支持手动点按钮立即触发测试

jobs:
  ping-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Ping Project 1
        run: |
          URL="${{ secrets.SUPABASE_URL_1 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_1 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ 错误：SUPABASE_URL_1 或 SUPABASE_ANON_KEY_1 未配置！"
            exit 1
          fi
          
          echo "🚀 正在向 Project 1 发起保活查询..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$URL/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          echo "Project 1 响应状态码: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Project 1 数据库保活成功！"
          else
            echo "❌ Project 1 保活失败，请核对 URL 或 Key 是否准确！"
            exit 1
          fi

      - name: Ping Project 2
        run: |
          URL="${{ secrets.SUPABASE_URL_2 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_2 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ 错误：SUPABASE_URL_2 或 SUPABASE_ANON_KEY_2 未配置！"
            exit 1
          fi
          
          echo "🚀 正在向 Project 2 发起保活查询..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$URL/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          echo "Project 2 响应状态码: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Project 2 数据库保活成功！"
          else
            echo "❌ Project 2 保活失败，请核对 URL 或 Key 是否准确！"
            exit 1
          fi

      # -----------------------------------------------------------
      # 原生无感防休眠（零第三方插件，永不失效）
      # -----------------------------------------------------------
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 检查并自动续期 60 天倒计时
        run: |
          # 获取上次代码提交时间与当前时间的间隔天数
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))

          echo "距上次提交已过去: $DAYS_DIFF 天"

          # 超过 40 天未提交时，才自动发起一次空提交重置 GitHub 的 60 天倒计时
          if [ $DAYS_DIFF -gt 40 ]; then
            echo "⚠️ 超过 40 天无活动，正在自动续期 GitHub 活跃状态..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep alive action [skip ci]"
            git push
            echo "✅ 成功重置 GitHub 60天定时任务倒计时！"
          else
            echo "✅ 活跃度正常（$DAYS_DIFF 天 < 40 天），无需生成多余提交，跳过。"
          fi
