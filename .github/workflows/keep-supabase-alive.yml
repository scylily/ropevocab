name: Keep Supabase Alive

on:
  schedule:
    # 设定 Cron 表达式：每周一和周四的中午 12:00 (UTC) 自动触发
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # 支持在 GitHub 网页上随时手动触发测试

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          # 发送轻量级的 API 请求，仅读取 1 条记录，足以激活数据库
          curl -s -f -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/terms?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
