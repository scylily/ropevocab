name: Keep Multiple Supabase Projects Alive

on:
  schedule:
    # 每周一、周四的中午 12:00 (UTC) 自动定时执行
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # 支持手动点按钮立即触发测试

jobs:
  ping-db:
    runs-on: ubuntu-latest
    # 授予操作权限，用于自动防 60 天休眠保活
    permissions:
      actions: write
      contents: write

    steps:
      - name: Ping Project 1
        run: |
          URL="${{ secrets.SUPABASE_URL_1 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_1 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ 错误：SUPABASE_URL_1 或 SUPABASE_ANON_KEY_1 未配置！"
            exit 1
          fi
          
          echo "🚀 正在向 Project 1 发起保活查询..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$URL/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          echo "Project 1 响应状态码: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Project 1 数据库保活成功！"
          else
            echo "❌ Project 1 保活失败，请核对 URL 或 Key 是否准确！"
            exit 1
          fi

      - name: Ping Project 2
        run: |
          URL="${{ secrets.SUPABASE_URL_2 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_2 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ 错误：SUPABASE_URL_2 或 SUPABASE_ANON_KEY_2 未配置！"
            exit 1
          fi
          
          echo "🚀 正在向 Project 2 发起保活查询..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "$URL/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY")
          
          echo "Project 2 响应状态码: $HTTP_STATUS"
          cat response.json
          echo ""

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Project 2 数据库保活成功！"
          else
            echo "❌ Project 2 保活失败，请核对 URL 或 Key 是否准确！"
            exit 1
          fi

      # -----------------------------------------------------------
      # 方案 A：防止 GitHub 60 天闲置自动休眠机制（无感保活）
      # 平时完全静默，仅在接近 50 天无提交时自动通过 API 续期
      # -----------------------------------------------------------
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 防 GitHub 60天休眠保活
        uses: gautamkrishnar/keepalive-workflow@v2
