name: Keep Multiple Supabase Projects Alive

on:
  schedule:
    # 每周一、周四的中午 12:00 (UTC) 自动定时执行
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # 支持手动点按钮立即触发测试

jobs:
  ping-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 初始化汇报日志
        run: |
          touch /tmp/report.log
          touch /tmp/failures.log

      # -----------------------------------------------------------
      # Project 1 保活
      # -----------------------------------------------------------
      - name: Ping Project 1
        continue-on-error: true
        run: |
          URL="${{ secrets.SUPABASE_URL_1 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_1 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ Project 1: SUPABASE_URL_1 或 KEY 未配置！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi
          
          echo "🚀 正在向 Project 1 发起保活查询..."
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -X GET "$URL/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" 2>&1) || CURL_EXIT=$?
          
          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ Project 1 网络解析/连接失败 (curl exit: $CURL_EXIT, 错误: $HTTP_STATUS)" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERR_MSG=$(cat response.json 2>/dev/null || echo "无响应体")
            echo "❌ Project 1 状态码异常 [$HTTP_STATUS] - $ERR_MSG" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          echo "✅ Project 1(IBTI & ropevocab): 状态码 200 保活成功" >> /tmp/report.log

      # -----------------------------------------------------------
      # Project 2 保活
      # -----------------------------------------------------------
      - name: Ping Project 2
        continue-on-error: true
        run: |
          URL="${{ secrets.SUPABASE_URL_2 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_2 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ Project 2: SUPABASE_URL_2 或 KEY 未配置！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi
          
          echo "🚀 正在向 Project 2 发起保活查询..."
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -X GET "$URL/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" 2>&1) || CURL_EXIT=$?
          
          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ Project 2 网络解析/连接失败 (curl exit: $CURL_EXIT, 错误: $HTTP_STATUS)" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERR_MSG=$(cat response.json 2>/dev/null || echo "无响应体")
            echo "❌ Project 2 状态码异常 [$HTTP_STATUS] - $ERR_MSG" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          echo "✅ Project 2(s4r): 状态码 200 保活成功" >> /tmp/report.log

      # -----------------------------------------------------------
      # Project 3 保活 (Study 教学库)
      # -----------------------------------------------------------
      - name: Ping Project 3
        continue-on-error: true
        run: |
          URL="${{ secrets.SUPABASE_URL_3 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_3 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ Project 3: SUPABASE_URL_3 或 KEY 未配置！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi
          
          echo "🚀 正在向 Project 3 发起保活查询..."
          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" \
            -X GET "$URL/rest/v1/_keepalive?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" 2>&1) || CURL_EXIT=$?
          
          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ Project 3 网络解析/连接失败 (curl exit: $CURL_EXIT, 错误: $HTTP_STATUS)" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERR_MSG=$(cat response.json 2>/dev/null || echo "无响应体")
            echo "❌ Project 3 状态码异常 [$HTTP_STATUS] - $ERR_MSG" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          echo "✅ Project 3 (Study): 状态码 200 保活成功" >> /tmp/report.log

      # -----------------------------------------------------------
      # 原生无感防休眠（重置 GitHub 60 天定时任务倒计时）
      # -----------------------------------------------------------
      - name: 检出仓库代码
        if: always()
        uses: actions/checkout@v4

      - name: 检查并自动续期 60 天倒计时
        if: always()
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))

          echo "距上次提交已过去: $DAYS_DIFF 天"

          if [ $DAYS_DIFF -gt 40 ]; then
            echo "⚠️ 超过 40 天无活动，正在自动续期 GitHub 活跃状态..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep alive action [skip ci]"
            git push
            echo "✅ 成功重置 GitHub 60天定时任务倒计时！"
            echo "🔄 GitHub 定时任务: 距上次提交已超40天，已自动提交续期" >> /tmp/report.log
          else
            echo "✅ 活跃度正常（$DAYS_DIFF 天 < 40 天），无需生成多余提交，跳过。"
            echo "ℹ️ GitHub 定时任务: 活跃度正常（距上次提交 $DAYS_DIFF 天）" >> /tmp/report.log
          fi

      # -----------------------------------------------------------
      # 📱 手机微信即时通知（无论成功还是失败都会发送）
      # -----------------------------------------------------------
      - name: 推送手机微信通知
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json

          token = os.environ.get("PUSHPLUS_TOKEN")
          if not token:
              print("⚠️ 未配置 PUSHPLUS_TOKEN，跳过手机微信推送。")
              exit(0)

          repo = os.environ.get("GITHUB_REPO")
          run_id = os.environ.get("GITHUB_RUN_ID")

          # 检查是否有失败记录
          has_error = False
          if os.path.exists("/tmp/failures.log"):
              with open("/tmp/failures.log", "r", encoding="utf-8") as f:
                  if f.read().strip():
                      has_error = True

          # 读取汇报详情
          details = ""
          if os.path.exists("/tmp/report.log"):
              with open("/tmp/report.log", "r", encoding="utf-8") as f:
                  details = f.read().strip()

          if has_error:
              title = "❌ Supabase 保活告警：发现异常！"
          else:
              title = "✅ Supabase 保活成功：所有项目正常"

          # 组装 HTML 格式的通知内容
          lines_html = "".join([f"<li>{line}</li>" for line in details.split("\n") if line.strip()])
          content = f"""
          <h3>{title}</h3>
          <p><b>仓库：</b>{repo}</p>
          <hr/>
          <p><b>执行状态清单：</b></p>
          <ul>{lines_html}</ul>
          <hr/>
          <p><a href="https://github.com/{repo}/actions/runs/{run_id}">👉 点击打开 GitHub Actions 运行记录</a></p>
          """

          data = {
              "token": token,
              "title": title,
              "content": content,
              "template": "html"
          }

          try:
              req = urllib.request.Request(
                  "http://www.pushplus.plus/send",
                  data=json.dumps(data).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  result = json.loads(resp.read().decode())
                  print("微信推送结果:", result)
          except Exception as e:
              print(f"❌ 微信推送发生错误: {e}")
          EOF
