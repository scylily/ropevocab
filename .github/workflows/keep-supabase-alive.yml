name: Keep Multiple Supabase Projects Alive

on:
  schedule:
    # 每周一、周四的中午 12:00 (UTC) 自动定时执行
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # 支持手动点击测试

jobs:
  ping-db:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 初始化汇报日志
        run: |
          touch /tmp/report.log
          touch /tmp/failures.log

      # -----------------------------------------------------------
      # Project 1 保活
      # -----------------------------------------------------------
      - name: Ping Project 1
        continue-on-error: true
        run: |
          URL="${{ secrets.SUPABASE_URL_1 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_1 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ Project 1: SUPABASE_URL_1 或 KEY 未配置！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi
          
          echo "🚀 正在向 Project 1 发起数据库写事务保活..."
          HTTP_STATUS=$(curl -sS -o /tmp/resp_1.json -w "%{http_code}" \
            -X PATCH "$URL/rest/v1/_keepalive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"updated_at": "now()"}' 2>&1) || CURL_EXIT=$?
          
          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ Project 1 网络解析/连接失败: $HTTP_STATUS" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERR_MSG=$(cat /tmp/resp_1.json 2>/dev/null || echo "无响应体")
            echo "❌ Project 1 数据库写事务失败 [$HTTP_STATUS] - $ERR_MSG" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          # 提取 Supabase 数据库引擎回传的实际写入时间
          DB_TIME=$(python3 -c "import json; data=json.load(open('/tmp/resp_1.json')); print(data[0]['updated_at'] if data else 'EMPTY')")
          if [ "$DB_TIME" = "EMPTY" ]; then
            echo "❌ Project 1 表中无 id=1 记录，未产生有效写入！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          echo "✅ Project 1(IBTI): Postgres 事务写入成功 [DB确认存活时间: $DB_TIME]" | tee -a /tmp/report.log

      # -----------------------------------------------------------
      # Project 2 保活
      # -----------------------------------------------------------
      - name: Ping Project 2
        continue-on-error: true
        run: |
          URL="${{ secrets.SUPABASE_URL_2 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_2 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ Project 2: SUPABASE_URL_2 或 KEY 未配置！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi
          
          echo "🚀 正在向 Project 2 发起数据库写事务保活..."
          HTTP_STATUS=$(curl -sS -o /tmp/resp_2.json -w "%{http_code}" \
            -X PATCH "$URL/rest/v1/_keepalive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"updated_at": "now()"}' 2>&1) || CURL_EXIT=$?
          
          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ Project 2 网络解析/连接失败: $HTTP_STATUS" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERR_MSG=$(cat /tmp/resp_2.json 2>/dev/null || echo "无响应体")
            echo "❌ Project 2 数据库写事务失败 [$HTTP_STATUS] - $ERR_MSG" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          DB_TIME=$(python3 -c "import json; data=json.load(open('/tmp/resp_2.json')); print(data[0]['updated_at'] if data else 'EMPTY')")
          if [ "$DB_TIME" = "EMPTY" ]; then
            echo "❌ Project 2 表中无 id=1 记录，未产生有效写入！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          echo "✅ Project 2(s4r): Postgres 事务写入成功 [DB确认存活时间: $DB_TIME]" | tee -a /tmp/report.log

      # -----------------------------------------------------------
      # Project 3 保活 (Study 教学库)
      # -----------------------------------------------------------
      - name: Ping Project 3
        continue-on-error: true
        run: |
          URL="${{ secrets.SUPABASE_URL_3 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_3 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ Project 3: SUPABASE_URL_3 或 KEY 未配置！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi
          
          echo "🚀 正在向 Project 3 发起数据库写事务保活..."
          HTTP_STATUS=$(curl -sS -o /tmp/resp_3.json -w "%{http_code}" \
            -X PATCH "$URL/rest/v1/_keepalive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"updated_at": "now()"}' 2>&1) || CURL_EXIT=$?
          
          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ Project 3 网络解析/连接失败: $HTTP_STATUS" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERR_MSG=$(cat /tmp/resp_3.json 2>/dev/null || echo "无响应体")
            echo "❌ Project 3 数据库写事务失败 [$HTTP_STATUS] - $ERR_MSG" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          DB_TIME=$(python3 -c "import json; data=json.load(open('/tmp/resp_3.json')); print(data[0]['updated_at'] if data else 'EMPTY')")
          if [ "$DB_TIME" = "EMPTY" ]; then
            echo "❌ Project 3 表中无 id=1 记录，未产生有效写入！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          echo "✅ Project 3(Study): Postgres 事务写入成功 [DB确认存活时间: $DB_TIME]" | tee -a /tmp/report.log

      # -----------------------------------------------------------
      # Project 4 保活 (plan 教案系统)
      # -----------------------------------------------------------
      - name: Ping Project 4
        continue-on-error: true
        run: |
          URL="${{ secrets.SUPABASE_URL_4 }}"
          KEY="${{ secrets.SUPABASE_ANON_KEY_4 }}"
          URL="${URL%/}"
          
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "❌ Project 4: SUPABASE_URL_4 或 KEY 未配置！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi
          
          echo "🚀 正在向 Project 4 发起数据库写事务保活..."
          HTTP_STATUS=$(curl -sS -o /tmp/resp_4.json -w "%{http_code}" \
            -X PATCH "$URL/rest/v1/_keepalive?id=eq.1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"updated_at": "now()"}' 2>&1) || CURL_EXIT=$?
          
          if [ -n "$CURL_EXIT" ] && [ "$CURL_EXIT" -ne 0 ]; then
            echo "❌ Project 4 网络解析/连接失败: $HTTP_STATUS" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          if [ "$HTTP_STATUS" -ne 200 ]; then
            ERR_MSG=$(cat /tmp/resp_4.json 2>/dev/null || echo "无响应体")
            echo "❌ Project 4 数据库写事务失败 [$HTTP_STATUS] - $ERR_MSG" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          DB_TIME=$(python3 -c "import json; data=json.load(open('/tmp/resp_4.json')); print(data[0]['updated_at'] if data else 'EMPTY')")
          if [ "$DB_TIME" = "EMPTY" ]; then
            echo "❌ Project 4 表中无 id=1 记录，未产生有效写入！" | tee -a /tmp/report.log >> /tmp/failures.log
            exit 1
          fi

          echo "✅ Project 4(plan): Postgres 事务写入成功 [DB确认存活时间: $DB_TIME]" | tee -a /tmp/report.log

      # -----------------------------------------------------------
      # 原生无感防休眠（重置 GitHub 60 天定时任务倒计时）
      # -----------------------------------------------------------
      - name: 检出仓库代码
        if: always()
        uses: actions/checkout@v4

      - name: 检查并自动续期 60 天倒计时
        if: always()
        run: |
          LAST_COMMIT_DATE=$(git log -1 --format=%ct)
          CURRENT_DATE=$(date +%s)
          DAYS_DIFF=$(( (CURRENT_DATE - LAST_COMMIT_DATE) / 86400 ))

          echo "距上次提交已过去: $DAYS_DIFF 天"

          if [ $DAYS_DIFF -gt 40 ]; then
            echo "⚠️ 超过 40 天无活动，正在自动续期 GitHub 活跃状态..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep alive action [skip ci]"
            git push
            echo "✅ 成功重置 GitHub 60天定时任务倒计时！"
            echo "🔄 GitHub 定时任务: 距上次提交已超40天，已自动提交续期" >> /tmp/report.log
          else
            echo "✅ 活跃度正常（$DAYS_DIFF 天 < 40 天），无需生成多余提交，跳过。"
            echo "ℹ️ GitHub 定时任务: 活跃度正常（距上次提交 $DAYS_DIFF 天）" >> /tmp/report.log
          fi

      # -----------------------------------------------------------
      # 📱 手机微信即时通知（附带 Supabase 数据库签名回执）
      # -----------------------------------------------------------
      - name: 推送手机微信通知
        if: always()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - << 'EOF'
          import os, urllib.request, json

          token = os.environ.get("PUSHPLUS_TOKEN")
          if not token:
              print("⚠️ 未配置 PUSHPLUS_TOKEN，跳过手机微信推送。")
              exit(0)

          repo = os.environ.get("GITHUB_REPO")
          run_id = os.environ.get("GITHUB_RUN_ID")

          has_error = False
          if os.path.exists("/tmp/failures.log"):
              with open("/tmp/failures.log", "r", encoding="utf-8") as f:
                  if f.read().strip():
                      has_error = True

          details = ""
          if os.path.exists("/tmp/report.log"):
              with open("/tmp/report.log", "r", encoding="utf-8") as f:
                  details = f.read().strip()

          if has_error:
              title = "❌ Supabase 数据库写事务保活失败！"
          else:
              title = "✅ Supabase 数据库写事务确认存活"

          lines_html = "".join([f"<li style='margin-bottom:6px;'>{line}</li>" for line in details.split("\n") if line.strip()])
          content = f"""
          <h3>{title}</h3>
          <p><b>执行仓库：</b>{repo}</p>
          <hr/>
          <p><b>Supabase 引擎事务响应确认：</b></p>
          <ul>{lines_html}</ul>
          <hr/>
          <p style="font-size:12px;color:#666;">注：每条记录后括号内的时间戳是由 Supabase 底层 Postgres 引擎在执行写入时生成并回传的绝对时间证据。</p>
          <p><a href="https://github.com/{repo}/actions/runs/{run_id}">👉 点击打开 GitHub Actions 运行记录</a></p>
          """

          data = {
              "token": token,
              "title": title,
              "content": content,
              "template": "html"
          }

          try:
              req = urllib.request.Request(
                  "http://www.pushplus.plus/send",
                  data=json.dumps(data).encode("utf-8"),
                  headers={"Content-Type": "application/json"}
              )
              with urllib.request.urlopen(req, timeout=15) as resp:
                  result = json.loads(resp.read().decode())
                  print("微信推送结果:", result)
          except Exception as e:
              print(f"❌ 微信推送发生错误: {e}")
          EOF
