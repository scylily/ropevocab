<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBTI 潜向行为性格指标测试</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="ibti_data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      :root {
        --primary: #1a1a1a;
        --accent: #c5a059;
        --bg: #ffffff;
        --option-bg: #f9f9f9;
        --border: #eeeeee;
      }

      html {
        font-size: 16px;
        /* 这是你的量化基准，1rem = 16px */
      }

      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background-color: #f5f5f5;
        color: #333;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
      }

      .container {
        max-width: 800px;
        width: 100%;
        background: var(--bg);
        padding: 40px 30px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        min-height: 100vh;
      }

      header {
        text-align: center;
        margin-bottom: 50px;
        border-bottom: 2px solid var(--primary);
        padding-bottom: 20px;
      }

      h1 {
        margin: 0;
        letter-spacing: 6px;
        font-size: 2.2em;
      }

      .sub-title {
        color: #888;
        font-size: 0.85em;
        margin-top: 10px;
        letter-spacing: 2px;
      }

      .section {
        display: none;
      }

      .active {
        display: block;
      }

      /* 答题区样式 */
      .q-item {
        margin-bottom: 50px;
      }

      .q-title {
        font-weight: bold;
        font-size: 1.15em;
        margin-bottom: 20px;
        display: block;
        color: var(--primary);
        line-height: 1.5;
      }

      .options-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* 1. 基础容器：缩小左边距，适配更精致的小图标 */
      .option-label {
        display: flex;
        align-items: center;
        padding: 15px 20px 15px 42px;
        /* 适当缩小了上下间距，左侧留出 42px */
        background: var(--option-bg);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 6px;
        /* 圆角稍微增加一点点，更柔和 */
        font-size: 0.95em;
        line-height: 1.4;
        position: relative;
        color: #444;
      }

      .option-label:hover {
        background: #fdfaf2;
        border-color: var(--accent);
      }

      .option-label input {
        display: none;
      }

      /* 2. 左侧的小方框 (未选中状态) */
      .option-label::before {
        content: "";
        position: absolute;
        left: 15px;
        /* 图标距离左边的距离 */
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        /* 尺寸从 18 缩小到 16，更精致 */
        height: 16px;
        border: 1.5px solid #ccc;
        /* 边框细一点 */
        border-radius: 3px;
        /* 小方框圆角 */
        background: #fff;
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      /* 3. 选中状态的整体样式 */
      .option-label.selected {
        background: #fffdf5;
        border-color: var(--accent);
        color: var(--accent);
        /* 选中后文字也稍微变色，加强反馈 */
      }

      /* 选中后方框变色 */
      .option-label.selected::before {
        background-color: var(--accent);
        border-color: var(--accent);
      }

      /* 4. 关键：选中后的“打钩”元素 */
      .option-label.selected::after {
        content: "";
        position: absolute;
        left: 20px;
        /* 打钩在方框内的精准定位 */
        top: 46%;
        /* 微调垂直高度使其视觉居中 */
        width: 4px;
        /* 钩子的短边 */
        height: 8px;
        /* 钩子的长边 */
        border: solid white;
        border-width: 0 2px 2px 0;
        /* 用边框拼出 L 型再旋转 */
        transform: translateY(-50%) rotate(45deg);
        /* 旋转 45 度变成钩 */
        transition: all 0.2s ease;
      }

      /* 按钮 */
      .btn-group {
        margin-top: 30px;
      }

      .btn {
        width: 100%;
        padding: 20px;
        background: var(--primary);
        color: #fff;
        border: none;
        font-size: 1.1em;
        letter-spacing: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 10px;
      }

      .btn-gold {
        background: var(--accent);
      }

      .btn-outline {
        background: #fff;
        color: #666;
        border: 1px solid #ddd;
      }

      /* 确认页清单 */
      .review-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        text-align: left;
        font-size: 0.9em;
      }

      .review-q {
        font-weight: bold;
        color: #555;
      }

      .review-a {
        color: var(--accent);
        margin-top: 5px;
      }

      /* 结果页 */
      #result-screen {
        text-align: center;
      }

      .res-code {
        font-size: 4em;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: 12px;
        margin: 20px 0;
      }

      .res-tag {
        font-size: 2em;
        font-weight: bold;
        margin-bottom: 30px;
      }

      .chart-box {
        max-width: 450px;
        margin: 30px auto;
        position: relative;
        width: 100%;
        /* 撑满父容器 */
        aspect-ratio: 1 / 1;
        /* 强制宽高比为 1:1，雷达图最舒服的比例 */
        /* background-color: #f9f9f9;临时加个背景色，看看盒子是不是真的变大了 */
      }

      #radarChart {
        width: 100%;
        height: 100%;
        display: block;
        margin: 0 auto;
      }

      .desc-box {
        text-align: left;
        background: #fafafa;
        padding: 30px;
        border-top: 3px solid var(--primary);
        line-height: 2;
        margin-top: 30px;
      }

      #capture-area {
        background: white;
        padding: 20px;
      }

      #debug-panel {
        /* 增加触摸响应范围 */
        touch-action: manipulation;
        /* 避免手机端长按弹出系统菜单 */
        -webkit-user-select: none;
        /* Safari 和 Chrome 的旧版本前缀 */
        user-select: none;
        /* 标准属性（必须加上这一行） */
      }

      /* === 手机端量化自适应补丁 (紧凑精致版) === */
      @media (max-width: 600px) {

        /* 1. 容器量化调整：进一步压缩顶部间距 */
        .container {
          padding: 0.8rem 0.5rem !important;
          width: 100%;
          box-shadow: none;
          /* 手机端取消阴影，节省物理感空间 */
        }

        /* 2. 标题和代号量化：从 1.4rem -> 1.2rem / 2rem -> 1.8rem */
        header h1 {
          font-size: 1.2rem;
          margin-bottom: 0.5rem !important;
          /* 标题下方的空隙 */
        }

        #res-code {
          font-size: 1.8rem !important;
          margin: 0.8rem 0 !important;
        }

        /* 3. 雷达图高度：从 300px 下调至 260px，为文字腾位 */
        .chart-box {
          height: 15rem !important;
          margin-bottom: 0.5rem;
        }

        /* 4. Markdown 文案量化排版：核心调小区域 */
        #res-desc {
          /* 核心：从 0.94rem 下调至 0.85rem (约13.6px) */
          font-size: 0.85rem !important;
          /* 行高从 1.75 下调至 1.6，让段落更紧凑 */
          line-height: 1.6;
          text-align: justify;
        }

        /* Markdown 内的标题：从 1.15rem -> 1.0rem (与根字体持平) */
        #res-desc h3 {
          font-size: 1.0rem !important;
          margin-top: 1.0rem !important;
          /* 减少间距 */
          border-bottom: 0.05rem solid #eee;
          padding-bottom: 0.2rem;
        }

        /* 列表缩进 */
        #res-desc ul,
        #res-desc ol {
          padding-left: 1rem !important;
          margin: 0.4rem 0;
        }

        /* 引用块/角色独白：从 0.9rem -> 0.8rem */
        #res-desc blockquote {
          margin: 0.5rem 0 !important;
          padding: 0.3rem 0.3rem !important;
          font-size: 0.8rem !important;
          background: #fcfcfc;
          border-left: 1.2px solid #ddd;
        }

        /* 5. 调试面板：保持原样 */
        #debug-panel {
          transform: scale(0.65);
          right: -180px;
          /* 往右边藏一点 */
        }
      }
    </style>
  </head>

  <body>

      let currentQuiz = [];
      let userAnswers = [];

      // 初始化：题目乱序+选项乱序
      function initQuiz() {
        // 1. 题目乱序：暂时注释掉 .sort()，保持 rawQuestions 的原始顺序
        // currentQuiz = rawQuestions.map((item, idx) => ({ ...item, id: idx })).sort(() => Math.random() - 0.5);
        currentQuiz = rawQuestions.map((item, idx) => ({ ...item, id: idx }));

        const container = document.getElementById('quiz-container');
        container.innerHTML = ''; // 确保初始化时容器是干净的

        currentQuiz.forEach((q, qIdx) => {
          const div = document.createElement('div');
          div.className = 'q-item';

          // 【核心改动】给每一题的容器加上唯一的 ID
          div.id = 'q-' + qIdx;

          // 2. 选项乱序：暂时注释掉 .sort()，固定为权重 [0, 1, 2, 3, 4] 的顺序
          // let optIdxs = [0, 1, 2, 3, 4].sort(() => Math.random() - 0.5);
          let optIdxs = [0, 1, 2, 3, 4];

          let optionsHtml = optIdxs.map(i => `
            <label class="option-label" onclick="selectOpt(this, ${qIdx}, ${i})">
                <input type="radio" name="q${qIdx}" value="${i}"> ${q.opts[i]}
            </label>
        `).join('');

          div.innerHTML = `<span class="q-title">${qIdx + 1}. ${q.q}</span><div class="options-list">${optionsHtml}</div>`;
          container.appendChild(div);
        });
      }

      function selectOpt(el, qIdx, weightIdx) {
        const parent = el.parentElement;
        parent.querySelectorAll('.option-label').forEach(child => child.classList.remove('selected'));
        el.classList.add('selected');
        userAnswers[qIdx] = { q: currentQuiz[qIdx].q, a: el.innerText, weight: weightIdx, data: currentQuiz[qIdx] };
      }

      // 确认清单页逻辑（修改版：增加淡红色高亮特效）
      function showReview() {
        // 1. 找出所有未做的题目序号
        let unanswered = [];
        for (let i = 0; i < 40; i++) {
          if (!userAnswers[i]) {
            unanswered.push(i + 1);
          }
        }

        // 2. 如果有未做的题目，弹出具体题号并拦截
        if (unanswered.length > 0) {
          const listStr = unanswered.join('、');
          alert("请完成所有题目后再提交。\n\n未完成题号：" + listStr);

          // 自动滚动到第一道没做的题
          const firstMiss = unanswered[0] - 1;
          const target = document.querySelector(`[data-qidx="${firstMiss}"]`) || document.getElementById(`q-${firstMiss}`);

          if (target) {
            // 【新增高亮效果】
            target.style.transition = "background-color 0.5s"; // 设置颜色变换的过渡时间
            target.style.backgroundColor = "#fff1f0";         // 设置为淡红色

            // 执行滚动
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // 2秒后自动恢复原背景色，形成一个“闪烁提醒”的效果
            setTimeout(() => {
              target.style.backgroundColor = "";
            }, 2000);
          }

          return;
        }

        // 3. 如果全部完成，进入确认清单页
        document.getElementById('quiz-section').classList.remove('active');
        document.getElementById('review-section').classList.add('active');
        window.scrollTo(0, 0);

        const list = document.getElementById('review-list');
        list.innerHTML = currentQuiz.map((qData, i) => `
            <div class="review-item">
              <div class="review-q">${i + 1}. ${qData.q}</div>
              <div class="review-a">选择：${userAnswers[i].a}</div>
            </div>
        `).join('');
      }

      function backToQuiz() {
        document.getElementById('review-section').classList.remove('active');
        document.getElementById('quiz-section').classList.add('active');
      }

      // 生成结果报告
      function generateReport() {
        // --- 1. 分数统计逻辑 (保持不变) ---
        let scores = { M: 0, S: 0, I: 0, R: 0, C: 0, O: 0, G: 0, D: 0 };
        userAnswers.forEach(ans => {
          const w = ans.weight;
          const A = ans.data.side[0];
          const B = ans.data.side[1];
          if (w === 0) scores[A] += 1.5;
          else if (w === 1) scores[A] += 0.5;
          else if (w === 2) { scores[A] += 0.2; scores[B] += 0.2; }
          else if (w === 3) scores[B] += 0.5;
          else if (w === 4) scores[B] += 1.5;
        });

        // --- 2. 判定维度逻辑 (保持不变) ---
        const getDim = (a, b) => {
          const net = scores[a] - scores[b];
          // 差值在 2 分以内判定为 X (混合型)
          return Math.abs(net) <= 2 ? 'X' : (net > 0 ? a : b);
        };

        // 生成 Key (代号)，如 "M-I-C-G"
        const code = `${getDim('M', 'S')}-${getDim('I', 'R')}-${getDim('C', 'O')}-${getDim('G', 'D')}`;

        // --- 3. 页面切换逻辑 ---
        document.getElementById('review-section').classList.remove('active');
        document.getElementById('result-section').classList.add('active');
        window.scrollTo(0, 0);

        // --- 4. 核心：获取并显示整段文案 ---

        // 获取代号显示容器并设置样式（居中）
        const resCodeElem = document.getElementById('res-code');
        if (resCodeElem) {
          resCodeElem.innerText = code;
          resCodeElem.style.textAlign = 'center';
          resCodeElem.style.display = 'block';
          resCodeElem.style.fontSize = '24px';    // 稍微大一点，更有冲击力
          resCodeElem.style.letterSpacing = '3px'; // 字母间距，看起来更专业
          resCodeElem.style.margin = '20px 0';    // 增加上下间距
        }

        // 隐藏旧的 res-tag 容器（因为它现在和内容里的 ### 标题重复了）
        const tagElem = document.getElementById('res-tag');
        if (tagElem) tagElem.style.display = 'none';

        // 从数据库中提取内容
        const fullContent = IBTI_DATA[code] || IBTI_DATA["X-X-X-X"];
        const descElem = document.getElementById('res-desc');

        if (fullContent && descElem) {
          // 使用 marked 解析 Markdown 并填充
          descElem.innerHTML = marked.parse(fullContent);
        } else if (descElem) {
          descElem.innerHTML = "抱歉，未找到对应的结果文案。";
        }

        // --- 5. 绘制雷达图 ---
        drawRadar(scores);
      }

      function drawRadar(s) {
        const ctx = document.getElementById('radarChart');

        // --- 优化1：销毁旧图表 (关键) ---
        // 如果之前已经生成过图表，先销毁它，否则多次测试时图表会重叠、闪烁
        if (window.myChart) {
          window.myChart.destroy();
        }

        // --- 优化2：配置图表数据与样式 ---
        window.myChart = new Chart(ctx, {
          type: 'radar',
          data: {
            // 维度标签，增加了一些间距感
            labels: ['掌控感(M)', '主导力(I)', '认知博弈(C)', '探索深度(D)', '配合度(S)', '响应度(R)', '本能驱动(O)', '情绪边界(G)'],
            datasets: [{
              label: '倾向值',
              data: [s.M, s.I, s.C, s.D, s.S, s.R, s.O, s.G],
              backgroundColor: 'rgba(197, 160, 89, 0.2)', // 填充颜色（金棕色）
              borderColor: 'rgba(197, 160, 89, 1)',     // 线条颜色
              borderWidth: 1,
              pointBackgroundColor: '#1a1a1a',          // 点的颜色
              pointRadius: 3                            // 点的大小
            }]
          },
          options: {
            responsive: true,           // 开启响应式
            maintainAspectRatio: false,  // 关闭强制比例，使其适配父容器高度
            layout: {
              padding: 5 // 把这个值调小（比如 5 或 10），图形会瞬间胀大
            },
            scales: {
              r: {
                min: 0,
                max: 15,            // 根据你的评分标准调整最大值
                beginAtZero: true,
                ticks: {
                  display: false, // 隐藏刻度数字，保持干净
                  stepSize: 3
                },
                grid: {
                  color: '#cccccc', // 网格线颜色
                  lineWidth: 1        // 也可以增加粗细，默认是 1
                },
                angleLines: {
                  color: '#cccccc', // 射线颜色
                  lineWidth: 1        // 也可以增加粗细，默认是 1
                },
                pointLabels: {
                  padding: 10,   // 标签离图形的距离，越小图越大
                  font: {
                    size: 12,           // 缩小标签字体，防止溢出
                    family: 'PingFang SC'
                  },
                  color: '#666'
                }
              }
            },
            plugins: {
              legend: {
                display: false // 隐藏顶部的图例
              },
              tooltip: {
                enabled: true // 开启鼠标悬停显示数值
              }
            }
          }
        });
      }

      function downloadImage(id, name) {
        const element = document.getElementById(id);
        html2canvas(element, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
          const link = document.createElement('a');
          link.download = `${name}.png`;
          link.href = canvas.toDataURL();
          link.click();
        });
      }

      window.onload = initQuiz;

      // 【测试专用】根据输入代号强制跳转结果页
      function debugCustomCode() {
        let input = document.getElementById('debug-input').value.trim().toUpperCase();

        // 1. 格式处理：如果用户输入 MICG，自动转为 M-I-C-G
        if (input.length === 4 && !input.includes('-')) {
          input = input.split('').join('-');
        }

        if (!input || input.split('-').length !== 4) {
          alert("请输入正确的四维代号，例如: M-I-C-G");
          return;
        }

        console.log("正在调试生成代号报告:", input);

        // 2. 模拟题目答案数据 (mock data)
        // 逻辑：如果是代号包含的字母，我们就给该维度满分（weight: 0 或 4）
        userAnswers = [];
        const parts = input.split('-'); // [M, I, C, G]

        for (let i = 0; i < 40; i++) {
          let side = [];
          let weight = 2; // 默认中立

          if (i < 10) {
            side = ['M', 'S'];
            if (parts[0] === 'M') weight = 0; else if (parts[0] === 'S') weight = 4;
          } else if (i < 20) {
            side = ['I', 'R'];
            if (parts[1] === 'I') weight = 0; else if (parts[1] === 'R') weight = 4;
          } else if (i < 30) {
            side = ['C', 'O'];
            if (parts[2] === 'C') weight = 0; else if (parts[2] === 'O') weight = 4;
          } else {
            side = ['G', 'D'];
            if (parts[3] === 'G') weight = 0; else if (parts[3] === 'D') weight = 4;
          }

          userAnswers.push({ weight: weight, data: { side: side } });
        }

        // 3. 切换页面状态
        const intro = document.getElementById('intro-section');
        const quiz = document.getElementById('quiz-section');
        const result = document.getElementById('result-section');

        if (intro) intro.classList.remove('active');
        if (quiz) quiz.classList.remove('active');
        if (result) result.classList.add('active');

        // 4. 执行原有的报告生成逻辑
        // 这样可以确保雷达图、Markdown 渲染、DOM 填充全部跑一遍
        if (typeof generateReport === "function") {
          generateReport();
        } else {
          // 如果你的提交函数叫 showReview，请根据实际情况改名
          showReview();
        }
      }

      // 切换面板展开/收起的逻辑
      function toggleDebugPanel() {
        const panel = document.getElementById('debug-panel');
        // 判断当前状态：如果右边距是负数，说明隐藏中，则展开；反之收起。
        if (panel.style.right === '0px') {
          panel.style.right = '-190px';
        } else {
          panel.style.right = '0px';
        }
      }

      // 之前的调试函数保持不变
      function debugCustomCode() {
        const code = document.getElementById('debug-input').value.toUpperCase();
        if (code) {
          // 假设你的显示函数叫 showReview 或类似名称
          if (typeof showReview === 'function') {
            // 这里如果是强制生成指定代号，你可能需要修改下你的 showReview 逻辑
            // 或者直接操作 resCode 变量
            localStorage.setItem('debug_res_code', code);
            location.reload(); // 简单粗暴的方法：存入缓存并刷新
          }
        }
      }
