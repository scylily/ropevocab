<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>IBTI 潜向行为性格指标测试</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="ibti_data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      /* ============================================================
       1. 全局配置与变量 (CSS Variables)
       ============================================================ */
      :root {
        --primary: #1a1a1a;
        --accent: #c5a059;
        --bg: #ffffff;
        --option-bg: #f9f9f9;
        --border: #eeeeee;
        --text-main: #333;
        --text-muted: #888;
      }

      * {
        box-sizing: border-box;
        /* 如果需要调试布局，请取消下面一行的注释 */
        /* outline: 1px solid rgba(255, 0, 0, 0.2); */
      }

      html {
        font-size: 16px;
        /* 量化基准：1rem = 16px */
      }

      body {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        background-color: #f5f5f5;
        color: var(--text-main);
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
      }

      /* ============================================================
       2. 基础布局结构 (Layout)
       ============================================================ */
      .container {
        max-width: 800px;
        width: 100%;
        background: var(--bg);
        padding: 40px 30px;
        box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        min-height: 100vh;
      }

      header {
        text-align: center;
        margin-bottom: 50px;
        border-bottom: 2px solid var(--primary);
        padding-bottom: 20px;
      }

      h1 {
        margin: 0;
        letter-spacing: 6px;
        font-size: 2.2em;
      }

      .sub-title {
        color: var(--text-muted);
        font-size: 0.85em;
        margin-top: 10px;
        letter-spacing: 2px;
      }

      .section {
        display: none;
      }

      .active {
        display: block;
      }

      /* ============================================================
       3. 答题区组件 (Quiz Components)
       ============================================================ */
      .q-item {
        margin-bottom: 50px;
      }

      .q-title {
        font-weight: bold;
        font-size: 1.15em;
        margin-bottom: 20px;
        display: block;
        color: var(--primary);
        line-height: 1.5;
      }

      .options-list {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }

      /* 选项容器 */
      .option-label {
        display: flex;
        align-items: center;
        padding: 15px 20px 15px 42px;
        background: var(--option-bg);
        border: 1px solid var(--border);
        cursor: pointer;
        transition: all 0.2s ease;
        border-radius: 6px;
        font-size: 0.95em;
        line-height: 1.4;
        position: relative;
        color: #444;
      }

      .option-label:hover {
        background: #fdfaf2;
        border-color: var(--accent);
      }

      .option-label input {
        display: none;
      }

      /* 左侧复选框小方框 (伪元素实现) */
      .option-label::before {
        content: "";
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        width: 16px;
        height: 16px;
        border: 1.5px solid #ccc;
        border-radius: 3px;
        background: #fff;
        box-sizing: border-box;
        transition: all 0.2s ease;
      }

      /* 选中状态样式 */
      .option-label.selected {
        background: #fffdf5;
        border-color: var(--accent);
        color: var(--accent);
      }

      .option-label.selected::before {
        background-color: var(--accent);
        border-color: var(--accent);
      }

      /* 选中后的打钩符号 */
      .option-label.selected::after {
        content: "";
        position: absolute;
        left: 20px;
        top: 46%;
        width: 4px;
        height: 8px;
        border: solid white;
        border-width: 0 2px 2px 0;
        transform: translateY(-50%) rotate(45deg);
        transition: all 0.2s ease;
      }

      /* ============================================================
       4. 按钮与操作区 (Actions)
       ============================================================ */
      .btn-group {
        margin-top: 30px;
      }

      .btn {
        width: 100%;
        padding: 20px;
        background: var(--primary);
        color: #fff;
        border: none;
        font-size: 1.1em;
        letter-spacing: 4px;
        cursor: pointer;
        font-weight: bold;
        margin-bottom: 10px;
        transition: opacity 0.2s;
      }

      .btn:active {
        opacity: 0.8;
      }

      .btn-gold {
        background: var(--accent);
      }

      .btn-outline {
        background: #fff;
        color: #666;
        border: 1px solid #ddd;
      }

      /* ============================================================
       5. 结果页与确认页 (Result & Review)
       ============================================================ */
      #result-screen {
        text-align: center;
      }

      #capture-area {
        background: white;
        padding: 20px;
      }

      .res-code {
        font-size: 4em;
        font-weight: 800;
        color: var(--accent);
        letter-spacing: 12px;
        margin: 20px 0;
      }

      .res-tag {
        font-size: 2em;
        font-weight: bold;
        margin-bottom: 30px;
      }

      /* 雷达图容器 */
      .chart-box {
        max-width: 450px;
        margin: 30px auto;
        position: relative;
        width: 100%;
        overflow: hidden;
        /* 掐掉任何冒出来的边角 */
        aspect-ratio: 1 / 1;
        /* 锁定 1:1 比例 */
      }

      #radarChart {
        width: 100%;
        height: 100%;
        display: block;
        margin: 0 auto;
      }

      /* 结果文案描述区 */
      .desc-box {
        text-align: left;
        background: #fafafa;
        padding: 30px;
        border-top: 3px solid var(--primary);
        line-height: 2;
        margin-top: 30px;
      }

      /* 确认页清单 */
      .review-item {
        padding: 15px;
        border-bottom: 1px solid #eee;
        text-align: left;
        font-size: 0.9em;
      }

      .review-q {
        font-weight: bold;
        color: #555;
      }

      .review-a {
        color: var(--accent);
        margin-top: 5px;
      }

      /* ============================================================
       6. 调试工具面板 (Debug Tool)
       ============================================================ */
      #debug-panel {
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
      }

      /* ============================================================
       7. 手机端量化自适应补丁 (Responsive)
       ============================================================ */
      @media (max-width: 600px) {

        html,
        body {
          width: 100%;
          overflow-x: hidden;
          /* 严禁横向溢出 */
          position: relative;
          -webkit-text-size-adjust: 100%;
          /* 禁止微信自动调整字体大小 */
        }

        body {
          padding: 0.5rem !important;
        }

        .container {
          padding: 0.8rem 0.4rem !important;
          box-shadow: none;
          border-radius: 0;
          width: 100% !important;
          max-width: 100vw !important;
          /* 强制容器不超过屏幕宽 */
          overflow: hidden;
          /* 内部溢出直接切掉，不准撑开页面 */
          box-sizing: border-box;
          /* 确保 padding 不增加宽度 */
        }

        header h1 {
          font-size: 1.2rem;
          margin-bottom: 0.5rem !important;
        }

        /* 强制拉满宽度，解除内边距限制 */
        #result-screen,
        .section,
        #capture-area {
          padding-left: 1 !important;
          padding-right: 1 !important;
          width: 100% !important;
        }

        #capture-area {
          padding: 1rem 10px !important;
        }

        #res-code {
          font-size: 1.8rem !important;
          margin: 0.8rem 0 !important;
        }

        .chart-box {
          width: 100%;
          height: auto;
          max-width: 90vw;
          /* 比屏幕窄一点，留出缓冲 */
          margin: 0 auto;
          position: relative;
          /* 核心：确保 canvas 不会瞬间撑大 */
          margin-bottom: 0.5rem;
        }

        #radarChart {
          width: 100% !important;
          height: auto !important;
        }

        /* 描述框移动端深度优化 */
        .desc-box {
          padding: 1.2rem 0.6rem !important;
          border-top: 1px solid #eee !important;
          margin-top: 1rem !important;
          margin-left: 0rem;
          margin-right: 0rem;
          width: auto;
        }

        /* Markdown 文案细节调整 */
        #res-desc {
          font-size: 0.85rem !important;
          line-height: 1.6;
          text-align: justify !important;
        }

        #res-desc h3 {
          font-size: 1.0rem !important;
          margin-top: 1.0rem !important;
          border-bottom: 0.05rem solid #eee;
          padding-bottom: 0.2rem;
        }

        #res-desc ul,
        #res-desc ol {
          padding-left: 1.2rem !important;
          margin: 0.4rem 0;
        }

        #res-desc blockquote {
          margin: 0.5rem 0 !important;
          padding: 0.3rem 0.3rem !important;
          font-size: 0.8rem !important;
          border-left: 1.2px solid #ddd;
        }

        /* 移动端调试面板定位 */
        #debug-panel {
          top: auto !important;
          bottom: 20px !important;
          right: -10px;
          transform: scale(0.65);
          transform-origin: right bottom;
          opacity: 0.9;
        }
      }
    </style>
  </head>

  <body>

    <div class="container" id="main-container">

      <div id="quiz-section" class="section active">
        <header>
          <h1>IBTI
            <p>潜向行为性格指标测试
          </h1>
          <div class="sub-title">Inclination Behavior Type Indicator
          </div>
        </header>
        <div id="quiz-container"></div>
        <div class="btn-group">
          <button class="btn" onclick="showReview()">核对选择并继续</button>
        </div>
      </div>

      <div id="review-section" class="section">
        <header>
          <h1>确认清单</h1>
          <div class="sub-title">请核对您的 40 项倾向选择</div>
        </header>
        <div id="review-list"></div>
        <div class="btn-group">
          <button class="btn btn-gold" onclick="generateReport()">确认无误，生成报告</button>
          <button class="btn btn-outline" onclick="backToQuiz()">返回修改</button>
          <button class="btn btn-outline" onclick="downloadImage('review-section', 'IBTI确认清单')">保存清单长图</button>

      </div>

      <div id="result-section" class="section">
        <div id="capture-area">
          <header>
            <h1>IBTI 结果报告</h1>
            <div class="sub-title">Personal Inclination Mapping</div>
          </header>

          <div class="res-code" id="res-code"></div>
          <div class="res-tag" id="res-tag"></div>
          <div class="chart-box">
            <canvas id="radarChart"></canvas>
          </div>
          <div class="desc-box" id="res-desc"></div>
        </div>
        <div class="btn-group">
          <button class="btn btn-gold" onclick="downloadImage('capture-area', 'IBTI结果报告')">保存映射全案长图</button>
          <button class="btn btn-outline" onclick="location.reload()">重新测试</button>
        </div>
      </div>

    </div>

      let currentQuiz = [];
      let userAnswers = [];
      let myChart = null;

      // --- 常用 DOM 节点缓存 (优化性能) ---
      const sections = {
        intro: document.getElementById('intro-section'),
        quiz: document.getElementById('quiz-section'),
        review: document.getElementById('review-section'),
        result: document.getElementById('result-section')
      };

      /**
       * 通用：页面切换器
       */
      function switchSection(targetKey) {
        Object.values(sections).forEach(sec => sec?.classList.remove('active'));
        if (sections[targetKey]) {
          sections[targetKey].classList.add('active');
          window.scrollTo(0, 0);
        }
      }

      /**
       * 初始化：渲染题目
       */
      function initQuiz() {
        // 题目顺序：如需乱序取消注释 .sort()
        currentQuiz = rawQuestions.map((item, idx) => ({ ...item, id: idx }));
        // .sort(() => Math.random() - 0.5);

        const container = document.getElementById('quiz-container');
        if (!container) return;
        container.innerHTML = '';

        currentQuiz.forEach((q, qIdx) => {
          const div = document.createElement('div');
          div.className = 'q-item';
          div.id = `q-${qIdx}`;

          // 选项顺序：如需乱序取消注释 .sort()
          const optIdxs = [0, 1, 2, 3, 4];
          // .sort(() => Math.random() - 0.5);

          const optionsHtml = optIdxs.map(i => `
        <label class="option-label" onclick="selectOpt(this, ${qIdx}, ${i})">
          <input type="radio" name="q${qIdx}" value="${i}"> ${q.opts[i]}
        </label>
      `).join('');

          div.innerHTML = `
        <span class="q-title">${qIdx + 1}. ${q.q}</span>
        <div class="options-list">${optionsHtml}</div>
      `;
          container.appendChild(div);
        });
      }

      /**
       * 选项点击处理
       */
      function selectOpt(el, qIdx, weightIdx) {
        const parent = el.parentElement;
        parent.querySelectorAll('.option-label').forEach(child => child.classList.remove('selected'));
        el.classList.add('selected');

        // 存储答案数据
        userAnswers[qIdx] = {
          q: currentQuiz[qIdx].q,
          a: el.innerText.trim(),
          weight: weightIdx,
          data: currentQuiz[qIdx]
        };
      }

      /**
       * 提交前校验及进入确认清单页
       */
      function showReview() {
        // 1. 查找未完成题号
        const unanswered = [];
        for (let i = 0; i < 40; i++) {
          if (!userAnswers[i]) unanswered.push(i + 1);
        }

        // 2. 漏题拦截逻辑
        if (unanswered.length > 0) {
          alert(`请完成所有题目后再提交。\n\n未完成题号：${unanswered.join('、')}`);

          const firstMissIdx = unanswered[0] - 1;
          const target = document.getElementById(`q-${firstMissIdx}`);

          if (target) {
            target.style.transition = "background-color 0.5s";
            target.style.backgroundColor = "#fff1f0";
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });

            // 闪烁提醒后恢复
            setTimeout(() => { target.style.backgroundColor = ""; }, 2000);
          }
          return; // 拦截，不继续向下执行
        }

        // 3. 进入清单页
        switchSection('review');

        const listContainer = document.getElementById('review-list');
        if (listContainer) {
          listContainer.innerHTML = currentQuiz.map((qData, i) => `
        <div class="review-item">
          <div class="review-q">${i + 1}. ${qData.q}</div>
          <div class="review-a">选择：${userAnswers[i].a}</div>
        </div>
      `).join('');
        }
      }

      function backToQuiz() {
        switchSection('quiz');
      }

      /**
       * 生成最终报告
       */
      function generateReport() {
        // 1. 分数统计 (加权逻辑保持原样)
        let scores = { M: 0, S: 0, I: 0, R: 0, C: 0, O: 0, G: 0, D: 0 };
        userAnswers.forEach(ans => {
          const w = ans.weight;
          const [A, B] = ans.data.side;
          if (w === 0) scores[A] += 1.5;
          else if (w === 1) scores[A] += 0.5;
          else if (w === 2) { scores[A] += 0.2; scores[B] += 0.2; }
          else if (w === 3) scores[B] += 0.5;
          else if (w === 4) scores[B] += 1.5;
        });

        // 2. 维度判定
        const getDim = (a, b) => {
          const net = scores[a] - scores[b];
          return Math.abs(net) <= 2 ? 'X' : (net > 0 ? a : b);
        };

        const code = `${getDim('M', 'S')}-${getDim('I', 'R')}-${getDim('C', 'O')}-${getDim('G', 'D')}`;

        // 3. 页面切换
        switchSection('result');

        // 4. UI 渲染与文案填充
        const resCodeElem = document.getElementById('res-code');
        if (resCodeElem) {
          resCodeElem.innerText = code;
          // 样式在 JS 中统一设置，确保视觉一致性
          Object.assign(resCodeElem.style, {
            textAlign: 'center',
            display: 'block',
            fontSize: '24px',
            letterSpacing: '3px',
            margin: '20px 0'
          });
        }

        const tagElem = document.getElementById('res-tag');
        if (tagElem) tagElem.style.display = 'none';

        const descElem = document.getElementById('res-desc');
        if (descElem) {
          const fullContent = IBTI_DATA[code] || IBTI_DATA["X-X-X-X"];
          descElem.innerHTML = fullContent ? marked.parse(fullContent) : "抱歉，未找到对应的结果文案。";
        }

        // 5. 绘制图表
        drawRadar(scores);
      }

      /**
       * 绘制雷达图
       */
      function drawRadar(s) {
        const ctx = document.getElementById('radarChart');
        if (!ctx) return;

        // 销毁旧实例防止重叠
        if (myChart) myChart.destroy();

        myChart = new Chart(ctx, {
          type: 'radar',
          data: {
            labels: ['掌控感(M)', '主导力(I)', '认知博弈(C)', '探索深度(D)', '配合度(S)', '响应度(R)', '本能驱动(O)', '情绪边界(G)'],
            datasets: [{
              label: '倾向值',
              data: [s.M, s.I, s.C, s.D, s.S, s.R, s.O, s.G],
              backgroundColor: 'rgba(197, 160, 89, 0.2)',
              borderColor: 'rgba(197, 160, 89, 1)',
              borderWidth: 1,
              pointBackgroundColor: '#1a1a1a',
              pointRadius: 3
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            layout: { padding: 5 },
            scales: {
              r: {
                min: 0,
                max: 15,
                beginAtZero: true,
                ticks: { display: false, stepSize: 3 },
                grid: { color: '#cccccc' },
                angleLines: { color: '#cccccc' },
                pointLabels: {
                  padding: 10,
                  font: { size: 12, family: 'PingFang SC' },
                  color: '#666'
                }
              }
            },
            plugins: {
              legend: { display: false },
              tooltip: { enabled: true }
            }
          }
        });
      }

      /**
       * 图片下载功能
       */
      function downloadImage(id, name) {
        const element = document.getElementById(id);
        if (!element) return;
        html2canvas(element, { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
          const link = document.createElement('a');
          link.download = `${name}.png`;
          link.href = canvas.toDataURL();
          link.click();
        });
      }

      /**
       * 【调试专用】根据代号跳转
       */
      function debugCustomCode() {
        let input = document.getElementById('debug-input')?.value.trim().toUpperCase() || "";

        // 自动补齐横杠：MICG -> M-I-C-G
        if (input.length === 4 && !input.includes('-')) {
          input = input.split('').join('-');
        }

        if (!input || input.split('-').length !== 4) {
          alert("请输入正确的四维代号，例如: M-I-C-G");
          return;
        }

        // 模拟数据填充
        userAnswers = [];
        const parts = input.split('-');
        const dimensions = [['M', 'S'], ['I', 'R'], ['C', 'O'], ['G', 'D']];

        for (let i = 0; i < 40; i++) {
          const dimIdx = Math.floor(i / 10);
          const [sideA, sideB] = dimensions[dimIdx];
          let weight = 2; // 默认中立

          if (parts[dimIdx] === sideA) weight = 0; // 偏向左侧
          else if (parts[dimIdx] === sideB) weight = 4; // 偏向右侧

          userAnswers.push({ weight: weight, data: { side: [sideA, sideB] } });
        }

        // 执行报告生成
        generateReport();
      }

      window.onload = initQuiz;
    </script>

    <div id="debug-panel" style="position: fixed; top: 10px; right: 10px; z-index: 9999; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 8px; color: white; font-family: monospace; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
      <div style="margin-bottom: 8px; font-weight: bold; color: #ff4757; font-size: 12px;">IBTI 结果页调试器</div>
      <input type="text" id="debug-input" placeholder="输入代号 如 M-I-C-G" style="width: 140px; padding: 5px; border: none; border-radius: 4px; outline: none;">
      <button onclick="debugCustomCode()" style="padding: 5px 10px; background: #2ed573; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px;">生成</button>
      <div style="font-size: 10px; color: #ccc; margin-top: 8px;">* 支持带横杠或不带横杠格式</div>
    </div>
