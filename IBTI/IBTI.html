<script>
(function() {
    function decodeBase64Utf8(base64Str) {
        try {
            const binaryString = window.atob(base64Str);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return new TextDecoder().decode(bytes);
        } catch (e) {
            return "加载失败";
        }
    }
    // 还原普通的 HTML 文本
    document.querySelectorAll('.safe-text').forEach(el => {
        const encrypted = el.getAttribute('data-safe');
        if (encrypted) {
            el.innerHTML = decodeBase64Utf8(encrypted);
        }
    });
    // 还原输入框的 Placeholder
    document.querySelectorAll('[data-safe-placeholder]').forEach(el => {
        const encrypted = el.getAttribute('data-safe-placeholder');
        if (encrypted) {
            el.setAttribute('placeholder', decodeBase64Utf8(encrypted));
        }
    });
})();
</script>
