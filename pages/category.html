<!DOCTYPE html>
<html lang="zh-CN">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>分类列表 - 常用绳缚词汇库</title>
    <link rel="stylesheet" href="../assets/css/v4r-h1.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <style>
      .state-container {
        text-align: center;
        padding: 60px 15px;
      }

      .spinner {
        font-size: 2rem;
        color: #667eea;
        margin-bottom: 15px;
        animation: fa-spin 1s infinite linear;
      }
    </style>
  </head>

  <body>
    <!-- 导航栏 -->
    <nav class="navbar">
      <div class="container">
        <a class="logo" href="../index.html">
          <i class="fas fa-book"></i>
          <span>常用绳缚词汇库</span>
        </a>
        <div class="nav-links">
          <a href="../index.html"><i class="fas fa-home"></i> 首页</a>
          <a class="active" id="nav-active-cat-tag"><i class="fas fa-folder-open"></i> 分类详情</a>
        </div>
      </div>
    </nav>

    <main>
      <!-- 面包屑导航 -->
      <div class="breadcrumb">
        <div class="container">
          <a href="../index.html">首页</a> &gt;
          <span id="breadcrumb-cat-title">分类加载中...</span>
        </div>
      </div>

      <!-- 状态占位 -->
      <div id="hub-loading" class="container state-container">
        <i class="fas fa-spinner spinner"></i>
        <p style="color: #666;">正在加载分类词条...</p>
      </div>

      <div id="hub-error" class="container state-container" style="display: none;">
        <div style="background: #fff0f0; border: 1px solid #fecaca; padding: 30px; border-radius: 10px; color: #c62828; max-width: 600px; margin: 0 auto;">
          <i class="fas fa-exclamation-triangle" style="font-size: 2rem; margin-bottom: 10px;"></i>
          <p class="error-message">请求的分类数据无法载入。</p>
          <a href="../index.html" class="back-button" style="margin-top: 15px;">返回首页</a>
        </div>
      </div>

      <!-- 主内容区 -->
      <div id="hub-main-content" style="display: none;">
        <!-- 技术分类页头 -->
        <header class="techniques-header">
          <div class="container">
            <h1 id="hub-title">-</h1>
            <p id="hub-description">-</p>
          </div>
        </header>

        <!-- 子分类/词条卡片网格 -->
        <section class="container">
          <div class="subcategory-nav" id="term-cards-grid"></div>
        </section>

        <!-- 返回按钮 -->
        <div class="container" style="text-align: center">
          <a href="../index.html" class="back-button">
            <i class="fas fa-arrow-left"></i> 返回首页
          </a>
        </div>
      </div>
    </main>

    <!-- 高可用 CDN 下沉引入 -->
    <script src="https://cdn.bootcdn.net/ajax/libs/supabase-js/2.39.8/supabase.min.js"></script>
    <script>
      if (typeof supabase === 'undefined') {
        document.write('<script src="https://unpkg.com/@supabase/supabase-js@2"><\/script>');
      }
    </script>
    <!-- 防御性修正：使用相对路径 ../ 确保 GitHub Pages / 本地运行皆可加载 -->
    <script src="/assets/js/supabase-config.js"></script>
    <script src="/assets/js/term-renderer.js"></script>
    <script src="/assets/js/footer.js?v=7.0.2"></script>
  </body>

</html>
